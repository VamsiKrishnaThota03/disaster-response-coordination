name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Coverage
        if: matrix.node == '22'
        run: npm run test:coverage

  auth-bypass-guard:
    # The AUTH_DISABLED bypass makes every anonymous request a signed-in admin.
    # This job proves the process refuses to start wherever that must not apply,
    # so the guard cannot silently regress into a comment again.
    name: refuses to boot with AUTH_DISABLED on a host
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Exits non-zero when AUTH_DISABLED is set with NODE_ENV=production
        env:
          AUTH_DISABLED: 'true'
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '3001'
        run: |
          # GitHub runs this with `bash -e`, so a non-zero `node` exit would
          # abort the step at the assignment before $? could be read. The
          # non-zero exit is the behaviour under test, so disable -e here.
          set +e
          output=$(node src/server.js 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::server started with the bypass enabled"; exit 1; }
          echo "$output" | grep -q "Refusing to start" || { echo "::error::missing refusal message"; exit 1; }

      - name: Exits non-zero when AUTH_DISABLED is set on a managed platform
        env:
          AUTH_DISABLED: 'true'
          RENDER: 'true'
          HOST: 127.0.0.1
          PORT: '3001'
        run: |
          # See the note above: -e must be off, the non-zero exit is the point.
          set +e
          output=$(node src/server.js 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0 || { echo "::error::server started with the bypass enabled"; exit 1; }
          echo "$output" | grep -q "RENDER" || { echo "::error::refusal did not name the marker"; exit 1; }

      - name: Still starts normally without the bypass
        env:
          HOST: 127.0.0.1
          PORT: '3001'
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: anon-key-for-ci
          NODE_ENV: production
        run: |
          set -euo pipefail
          node src/server.js & SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/health | tee /dev/stderr | grep -q '"status":"ok"'

          # Supabase credentials are fake, so readiness must report 503 with a
          # hint rather than the process dying or liveness going red.
          code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:3001/health/ready)
          cat ready.json
          test "$code" = "503" || { echo "::error::expected readiness 503, got $code"; exit 1; }
          grep -q '"status":"unavailable"' ready.json

          # Writes must be rejected: the bypass is off, so there is no admin.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:3001/api/disasters \
            -H 'Content-Type: application/json' -d '{"title":"x","description":"y"}')
          test "$code" = "401" || { echo "::error::expected 401 for an anonymous write, got $code"; exit 1; }

      - name: Graceful shutdown on SIGTERM
        env:
          HOST: 127.0.0.1
          PORT: '3002'
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: anon-key-for-ci
        run: |
          set -euo pipefail
          node src/server.js & SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3002/health > /dev/null && break
            sleep 1
          done
          kill -TERM $SERVER_PID
          for i in $(seq 1 15); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "exited cleanly"; exit 0; fi
            sleep 1
          done
          echo "::error::server did not shut down on SIGTERM"
          exit 1

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: disaster-response-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image refuses to start with the auth bypass enabled
        run: |
          output=$(docker run --rm -e AUTH_DISABLED=true \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_ANON_KEY=anon \
            disaster-response-backend:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Refusing to start" \
            || { echo "::error::image booted with the bypass enabled"; exit 1; }
